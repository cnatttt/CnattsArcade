<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nightfall Siege</title>
<meta name="description" content="Tower defense: build and upgrade 7 towers, hold 5 maps against monster waves and bosses.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #05030a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); display: block; touch-action: none; cursor: crosshair; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script src="../account/config.js"></script><script src="../account/account.js"></script><script src="../account/arcade.js"></script><script src="../account/cheats.js" defer></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/data.js"></script>
<script src="js/game.js"></script>
<script src="../assets/touch.js"></script>
<script>TouchPad.setup({ active: () => false });</script>
</body>
</html>
