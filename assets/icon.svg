<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1458"/><stop offset="1" stop-color="#0c0824"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4fd8"/><stop offset="1" stop-color="#3ae0ff"/></linearGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#ffb0b8"/><stop offset=".35" stop-color="#ff3a5a"/><stop offset="1" stop-color="#a0102e"/></radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3a8a"/><stop offset="1" stop-color="#1e1640"/></linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8e8f8"/><stop offset="1" stop-color="#7a7aa0"/></linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="url(#rim)" stroke-width="3.5"/>
  <!-- base -->
  <ellipse cx="32" cy="47" rx="20" ry="7.5" fill="#07051a" opacity=".6"/>
  <path d="M12 42 Q12 36 32 36 Q52 36 52 42 L52 45 Q52 51 32 51 Q12 51 12 45 Z" fill="url(#base)" stroke="#07051a" stroke-width="1.6"/>
  <ellipse cx="32" cy="41.5" rx="19" ry="5.5" fill="#5a4aa8" stroke="#07051a" stroke-width="1.4"/>
  <!-- buttons -->
  <ellipse cx="44" cy="41" rx="4" ry="2.4" fill="#3ae0ff" stroke="#07051a" stroke-width="1.2"/>
  <ellipse cx="44" cy="40.3" rx="2.2" ry="1" fill="#c8f8ff"/>
  <!-- stick -->
  <path d="M30 41 L27.5 24 L32 23.4 L33.6 41 Z" fill="url(#stick)" stroke="#07051a" stroke-width="1.4" stroke-linejoin="round"/>
  <ellipse cx="31.8" cy="41.2" rx="4.6" ry="2" fill="#07051a"/>
  <!-- ball -->
  <circle cx="28.6" cy="19" r="10" fill="url(#ball)" stroke="#07051a" stroke-width="1.8"/>
  <ellipse cx="25.4" cy="15.2" rx="3.4" ry="2.2" fill="#fff" opacity=".85" transform="rotate(-30 25.4 15.2)"/>
  <!-- sparkle -->
  <path d="M49 13 L50.2 17.3 L54.5 18.5 L50.2 19.7 L49 24 L47.8 19.7 L43.5 18.5 L47.8 17.3 Z" fill="#ffd84a"/>
