<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Clash</title>
<meta name="description" content="7 two-player party mini-games: same keyboard, vs computer, or online with a room code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0a0620; overflow: hidden; }
  canvas { position: absolute; inset: 0; margin: auto; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; width: 100vw; height: auto; top: 50%; transform: translateY(-50%); display: block; touch-action: none; }
  @media (min-aspect-ratio: 16/9) { canvas { height: 100vh; width: auto; top: 0; transform: none; } }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script src="js/audio.js"></script>
<script src="js/net.js"></script>
<script src="js/games.js"></script>
<script src="js/main.js"></script>
</body>
</html>
