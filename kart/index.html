<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turbo Karts</title>
<meta name="description" content="3D kart racing: 4 tracks, 8 racers, drifting, items, Grand Prix and 2-player split screen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; }
  #wrap { position: absolute; inset: 0; margin: auto; aspect-ratio: 16 / 9; max-width: 100vw; max-height: 100vh; width: 100vw; height: auto; top: 50%; transform: translateY(-50%); }
  @media (min-aspect-ratio: 16/9) { #wrap { height: 100vh; width: auto; top: 0; transform: none; } }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { touch-action: none; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl" width="1280" height="720"></canvas>
  <canvas id="ui" width="1280" height="720"></canvas>
</div>
<script src="../account/config.js"></script><script src="../account/account.js"></script><script src="../account/arcade.js"></script><script src="../account/cheats.js" defer></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/tracks.js"></script>
<script src="js/world.js"></script>
<script>window.NET_PREFIX = "turbokarts-cnatt-";</script><script src="../assets/net.js"></script><script src="../assets/ranked.js"></script>
<script src="js/game.js"></script>
</body>
</html>
