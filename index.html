<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cnatt's Arcade</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07061a; --panel: #141029; --panel2: #1d1838; --line: #3a2f63;
    --text: #ece8ff; --muted: #9a92c4; --gold: #ffcc33;
    --pixel: 'Press Start 2P', monospace; --body: 'VT323', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--body); font-size: 22px;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 72% 12%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 38% 32%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 40%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 62%, #fff4 50%, transparent 51%),
      radial-gradient(1px 1px at 58% 78%, #fff4 50%, transparent 51%),
      radial-gradient(ellipse at 50% -10%, #3a1e5280, transparent 60%),
      radial-gradient(ellipse at 50% 120%, #1e2a5280, transparent 60%);
    background-attachment: fixed;
  }

  /* ---------------- menu ---------------- */
  #menu { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 56px 20px 32px; }
  h1 {
    font-family: var(--pixel); font-size: clamp(22px, 4.4vw, 46px); margin: 0 0 14px; letter-spacing: 2px;
    color: var(--gold); text-align: center;
    text-shadow: 0 4px 0 #6a3a10, 0 0 24px #ffcc3355;
  }
  .subtitle { font-family: var(--pixel); font-size: 12px; color: var(--muted); margin-bottom: 44px; letter-spacing: 3px; text-transform: uppercase; }
  .subtitle::before, .subtitle::after { content: " ✦ "; color: var(--line); }

  #grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 28px; width: 100%; max-width: 1180px; }
  .card {
    --accent: #b07cff;
    background: var(--panel); border: 4px solid var(--line); cursor: pointer; text-align: left; color: inherit;
    font: inherit; padding: 0; display: flex; flex-direction: column;
    box-shadow: 0 6px 0 #00000088; transition: transform .12s, border-color .12s, box-shadow .12s;
    outline: none;
  }
  .card:hover, .card:focus-visible { transform: translateY(-6px); border-color: var(--accent); box-shadow: 0 12px 0 #00000088, 0 0 30px color-mix(in srgb, var(--accent) 35%, transparent); }
  .card:active { transform: translateY(0); box-shadow: 0 2px 0 #00000088; }
  .thumb { aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; image-rendering: pixelated; border-bottom: 4px solid var(--line); position: relative; }
  .card:hover .thumb { border-color: var(--accent); }
  .tag {
    position: absolute; top: 12px; left: 12px; font-family: var(--pixel); font-size: 9px; padding: 7px 9px;
    background: #07061acc; color: var(--accent); border: 2px solid var(--accent); letter-spacing: 1px; text-transform: uppercase;
  }
  .info { padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .title { font-family: var(--pixel); font-size: 15px; line-height: 1.4; }
  .desc { color: var(--muted); line-height: 1.1; flex: 1; }
  .play {
    align-self: flex-start; font-family: var(--pixel); font-size: 11px; padding: 11px 16px; margin-top: 6px;
    background: var(--accent); color: #07061a; box-shadow: inset 0 -4px 0 #0005, 0 3px 0 #000a;
  }
  footer { margin-top: auto; padding-top: 48px; color: var(--muted); font-size: 18px; }

  /* ---------------- sound controls ---------------- */
  #sound { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 20; }
  #sound button {
    font-family: var(--pixel); font-size: 10px; color: var(--text); background: var(--panel2);
    border: 3px solid var(--line); padding: 9px 10px; cursor: pointer; box-shadow: 0 3px 0 #000a;
  }
  #sound button.off { color: #ff7a7a; text-decoration: line-through; }
  #sound button:hover { border-color: var(--gold); }
  #sound button:active { transform: translateY(2px); box-shadow: none; }
  #soundHint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); font-family: var(--pixel); font-size: 9px;
    color: var(--muted); letter-spacing: 1px; animation: blink 1.4s steps(2) infinite; pointer-events: none; }
  @keyframes blink { 50% { opacity: .25; } }

  /* ---------------- secret ---------------- */
  #spore { display: inline-block; width: 16px; height: 16px; margin-left: 10px; vertical-align: -2px; cursor: pointer;
    opacity: .14; transition: opacity .3s, transform .2s; image-rendering: pixelated; }
  #spore:hover { opacity: .5; transform: scale(1.3) rotate(-8deg); }
  #spore.found { opacity: .9; filter: drop-shadow(0 0 6px #ff6a7a); }
  h1.rainbow { animation: rainbow 1.2s linear infinite; }
  @keyframes rainbow { 0%{color:#ff6a7a} 20%{color:#ffcc33} 40%{color:#6ae06a} 60%{color:#6ad0ff} 80%{color:#b07cff} 100%{color:#ff6a7a} }
  #rain { position: fixed; inset: 0; pointer-events: none; z-index: 30; image-rendering: pixelated; }
  #secretBox { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 40; background: #07061acc; }
  #secretBox.open { display: flex; }
  #secretBox .box { background: var(--panel); border: 4px solid #ff6a7a; box-shadow: 0 8px 0 #000a, 0 0 40px #ff6a7a66;
    padding: 34px 40px; max-width: 520px; text-align: center; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  #secretBox h2 { font-family: var(--pixel); font-size: 18px; color: #ff9ab0; margin: 0 0 18px; line-height: 1.5; }
  #secretBox p { color: var(--muted); margin: 0 0 14px; }
  #secretBox b { color: var(--gold); }
  #secretBox button { font-family: var(--pixel); font-size: 11px; padding: 12px 18px; margin-top: 8px; cursor: pointer;
    background: #ff6a7a; color: #07061a; border: 0; box-shadow: inset 0 -4px 0 #0005, 0 3px 0 #000a; }

  /* ---------------- player ---------------- */
  #player { position: fixed; inset: 0; display: none; flex-direction: column; background: #000; }
  #player.open { display: flex; }
  #bar {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--panel);
    border-bottom: 3px solid var(--line); font-family: var(--pixel); font-size: 11px;
  }
  #bar button, #bar a {
    font-family: var(--pixel); font-size: 10px; color: var(--text); background: var(--panel2); text-decoration: none;
    border: 2px solid var(--line); padding: 8px 12px; cursor: pointer; box-shadow: 0 3px 0 #000a;
  }
  #bar button:hover, #bar a:hover { border-color: var(--gold); color: var(--gold); }
  #bar button:active, #bar a:active { transform: translateY(2px); box-shadow: none; }
  #nowPlaying { flex: 1; text-align: center; color: var(--gold); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #frame { flex: 1; width: 100%; border: 0; background: #000; }

  @media (max-width: 600px) {
    #bar { font-size: 9px; gap: 6px; }
    #bar .hide-sm { display: none; }
  }
</style>
</head>
<body>

<div id="menu">
  <h1 id="siteTitle">CNATT'S ARCADE</h1>
  <div class="subtitle" id="siteSubtitle">Pick a game</div>
  <div id="grid"></div>
  <footer><span id="siteFooter"></span><svg id="spore" viewBox="0 0 8 8" shape-rendering="crispEdges" title="">
    <rect x="2" y="0" width="4" height="1" fill="#b0283a"/><rect x="1" y="1" width="6" height="1" fill="#b0283a"/>
    <rect x="0" y="2" width="8" height="2" fill="#b0283a"/><rect x="2" y="1" width="1" height="1" fill="#fff"/>
    <rect x="5" y="2" width="1" height="1" fill="#fff"/><rect x="1" y="3" width="1" height="1" fill="#fff"/>
    <rect x="3" y="4" width="2" height="4" fill="#e8dcc8"/><rect x="2" y="7" width="4" height="1" fill="#e8dcc8"/></svg></footer>
</div>

<div id="sound"><button id="musicBtn" title="Music">♪ MUSIC</button><button id="sfxBtn" title="Sound effects">SFX</button></div>
<div id="soundHint">click anywhere for sound</div>
<canvas id="rain"></canvas>
<div id="secretBox"><div class="box">
  <h2>YOU FOUND THE<br>SECRET SPORE!</h2>
  <p>Only true explorers find this mushroom.</p>
  <p>Reward unlocked: the <b>Sporecaster Rod</b> is waiting for you in <b>Fishing Simulator</b>.</p>
  <button id="secretOk">NICE!</button>
</div></div>

<div id="player">
  <div id="bar">
    <button id="backBtn" title="Back to menu (Esc)">◀ MENU</button>
    <div id="nowPlaying"></div>
    <button id="fsBtn" class="hide-sm" title="Fullscreen">⛶ FULL</button>
    <a id="tabBtn" class="hide-sm" target="_blank" rel="noopener" title="Open in a new tab">↗ TAB</a>
  </div>
  <iframe id="frame" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
</div>

<script src="assets/audio.js"></script>
<script src="games.js"></script>
<script>window.ACCOUNT_HUB = true;</script>
<script src="account/config.js"></script>
<script src="account/account.js"></script>
<script src="account/ui.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const menu = $('menu'), player = $('player'), frame = $('frame');

  // site text from games.js
  $('siteTitle').textContent = SITE.title;
  $('siteSubtitle').textContent = SITE.subtitle;
  $('siteFooter').textContent = SITE.footer;
  document.title = SITE.title.replace(/'S /, "'s ");

  // build the cards
  for (const g of GAMES) {
    const card = document.createElement('button');
    card.className = 'card';
    card.style.setProperty('--accent', g.accent || '#b07cff');
    card.innerHTML = `
      <div class="thumb" style="background-image:url('${g.thumbnail}')"><span class="tag"></span></div>
      <div class="info">
        <div class="title"></div>
        <div class="desc"></div>
        <span class="play">▶ PLAY</span>
      </div>`;
    card.querySelector('.tag').textContent = g.tag || 'Game';
    card.querySelector('.title').textContent = g.title;
    card.querySelector('.desc').textContent = g.description || '';
    card.onmouseenter = () => Sound.play('hover');
    card.onclick = () => { Sound.play('click2'); setTimeout(() => { location.hash = g.id; }, 120); };
    $('grid').appendChild(card);
  }

  // routing: yoursite.com/#fishing opens that game directly
  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    const g = GAMES.find(x => x.id === id);
    if (!g) {
      player.classList.remove('open'); menu.style.display = '';
      Sound.playSong(SONGS.arcade); $('sound').style.display = ''; $('acctBtn').style.display = '';
      if (Account.user) { Account.setPlaying(null); Account.flush(); }
      frame.src = 'about:blank';
      document.title = SITE.title.replace(/'S /, "'s ");
      return;
    }
    const url = g.folder.replace(/\/+$/, '') + '/index.html';
    $('nowPlaying').textContent = g.title;
    $('tabBtn').href = url;
    document.title = g.title + ' | ' + SITE.title.replace(/'S /, "'s ");
    menu.style.display = 'none'; player.classList.add('open');
    Sound.stopSong(); $('sound').style.display = 'none'; $('acctBtn').style.display = 'none';
    Account.setPlaying(g.title);
    // wait (briefly) for cloud saves to come down before the game reads them
    if (!frame.src.endsWith(url)) Promise.race([Account.init().then(() => Account.firstSync), new Promise(r => setTimeout(r, 5000))]).then(() => { if (location.hash.slice(1) === g.id && !frame.src.endsWith(url)) frame.src = url; });
  }
  window.addEventListener('hashchange', route);
  Account.init();
  route();

  frame.addEventListener('load', () => { try { frame.contentWindow.focus(); } catch (e) {} });
  ['backBtn', 'fsBtn', 'tabBtn'].forEach(id => { $(id).addEventListener('mouseenter', () => Sound.play('hover')); });
  $('fsBtn').addEventListener('click', () => Sound.play('click'));
  $('backBtn').onclick = () => { Sound.play('back'); history.pushState('', '', location.pathname + location.search); route(); };
  $('fsBtn').onclick = () => {
    const el = frame;
    (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
  };
  // ---------------- sound buttons
  function syncSound() {
    $('musicBtn').classList.toggle('off', !Sound.musicOn);
    $('sfxBtn').classList.toggle('off', !Sound.sfxOn);
  }
  $('musicBtn').onclick = e => { e.stopPropagation(); Sound.init(); Sound.setMusic(!Sound.musicOn); Sound.play('tab'); syncSound(); };
  $('sfxBtn').onclick = e => { e.stopPropagation(); Sound.init(); Sound.setSfx(!Sound.sfxOn); Sound.play('tab'); syncSound(); };
  syncSound();
  window.addEventListener('pointerdown', () => { $('soundHint').style.display = 'none'; }, { once: true });
  window.addEventListener('keydown', () => { $('soundHint').style.display = 'none'; }, { once: true });

  // ---------------- the secret spore (easter egg)
  let secretFound = false;
  try { secretFound = localStorage.getItem('cnatt_arcade_secret') === 'found'; } catch (e) {}
  if (secretFound) $('spore').classList.add('found');
  $('spore').addEventListener('click', e => {
    e.stopPropagation(); Sound.init();
    try { localStorage.setItem('cnatt_arcade_secret', 'found'); } catch (err) {}
    $('spore').classList.add('found');
    $('siteTitle').classList.add('rainbow');
    Sound.play('secret');
    setTimeout(() => Sound.playSong(SONGS.secret), 900);
    makeItRain();
    setTimeout(() => $('secretBox').classList.add('open'), 700);
  });
  $('secretOk').onclick = () => {
    Sound.play('click'); $('secretBox').classList.remove('open');
    $('siteTitle').classList.remove('rainbow');
    if (!location.hash) Sound.playSong(SONGS.arcade);
  };
  function pixelSprite(rows, pal) {
    const c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length;
    const x = c.getContext('2d');
    rows.forEach((r, y) => [...r].forEach((ch, i) => { if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, y, 1, 1); } }));
    return c;
  }
  function makeItRain() {
    const cv = $('rain'), x = cv.getContext('2d');
    cv.width = innerWidth; cv.height = innerHeight; x.imageSmoothingEnabled = false;
    const sprites = [
      pixelSprite(['..rrrr..', '.rwrrwr.', 'rrrrrrwr', 'rwrrrrrr', '...ss...', '...ss...', '..ssss..'], { r: '#d8343c', w: '#ffffff', s: '#e8dcc8' }),
      pixelSprite(['..pppp..', '.pcppcp.', 'pppppppp', '...ss...', '...ss...', '..ssss..'], { p: '#9a4ae0', c: '#d8a8ff', s: '#e8dcc8' }),
      pixelSprite(['...o...', '..oyo..', 'ooyyyoo', 'oyyyyyo', '.oyyyo.', '.oyoyo.', 'oo...oo'], { o: '#5a3a0e', y: '#ffe680' }),
      pixelSprite(['..oo..', '.oyyo.', 'oyyyyo', 'oyyyyo', '.oyyo.', '..oo..'], { o: '#5a3a0e', y: '#f2c14e' }),
      pixelSprite(['yyyy', 'yyyy', 'yyyy', 'yyyy'], { y: '#ffd400' }), pixelSprite(['rrrr', 'rrrr', 'rrrr', 'rrrr'], { r: '#e02a2a' }),
    ];
    ['golden_koi', 'bluegill', 'abyss_eel', 'witchscale', 'nebula_tetra', 'prism_ray', 'devourer', 'lunar_carp'].forEach(id => {
      const im = new Image(); im.src = 'fishing/images/fish/' + id + '.png'; sprites.push(im);
    });
    const glyphs = ['♞', '♛', '♜', '♚'];
    const drops = Array.from({ length: 140 }, (_, i) => ({
      x: Math.random() * cv.width, y: -40 - Math.random() * cv.height * 1.2, vy: 120 + Math.random() * 220, vx: (Math.random() - .5) * 60,
      r: Math.random() * 6, vr: (Math.random() - .5) * 6, sc: 3 + Math.floor(Math.random() * 3),
      s: i % 9 === 0 ? glyphs[i % 4] : sprites[i % sprites.length],
    }));
    let last = performance.now(), start = last;
    (function step(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      x.clearRect(0, 0, cv.width, cv.height);
      drops.forEach(d => {
        d.y += d.vy * dt; d.x += d.vx * dt; d.r += d.vr * dt;
        x.save(); x.translate(d.x, d.y); x.rotate(d.r);
        if (typeof d.s === 'string') { x.font = `${d.sc * 10}px serif`; x.fillStyle = d.sc % 2 ? '#e8e4f0' : '#b07cff'; x.fillText(d.s, -10, 10); }
        else if (d.s.width) { const k = d.s.width > 16 ? Math.max(1, d.sc - 2) : d.sc; x.imageSmoothingEnabled = false; x.scale(k, k); x.drawImage(d.s, -d.s.width / 2, -d.s.height / 2); }
        x.restore();
      });
      if (now - start < 7000) requestAnimationFrame(step); else x.clearRect(0, 0, cv.width, cv.height);
    })(last);
  }

  // Esc goes back to the menu (only when the page itself has focus, so games can still use Esc)
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && player.classList.contains('open')) $('backBtn').click(); });
</script>
</body>
</html>
